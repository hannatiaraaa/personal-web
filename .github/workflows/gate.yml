name: gate

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same major the deploy target runs, so a version-specific
      # failure surfaces in CI rather than at deploy.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The e2e projects run Chromium, Firefox and WebKit, so all three are installed.
      - name: install browsers
        run: bunx playwright install --with-deps chromium firefox webkit

      # The whole chain, as locally: format, lint, types, build, budget, unit, e2e.
      # No environment variables are set on purpose: a clean clone has to render
      # complete pages, and the assertion that no asset URL contains "undefined"
      # only means something when nothing is configured.
      - name: gate
        run: bun run gate

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
